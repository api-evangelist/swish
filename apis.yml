name: Swish
description: >-
  Swish (operated by Munchmart Technologies Private Limited) is a Bengaluru-based
  quick-commerce food delivery startup founded in 2024 that promises meals at your
  door in ten minutes. It runs a full-stack, vertically integrated model — owning
  its neighbourhood cloud kitchens ("delight centres"), sourcing and supply chain,
  proprietary ordering/routing technology, and its own last-mile delivery fleet —
  operating dense hyperlocal clusters of roughly 1.5–2 km. The company focuses on
  frequent, lower-ticket occasions such as breakfast, snacks, and late-night meals,
  and reports around 20,000 orders a day across Bengaluru micro-markets. Swish raised
  a $38M Series B led by Hara Global and Bain Capital Ventures with participation from
  Accel, valuing it at $139M post-money and bringing total funding to about $54M. Swish
  is a consumer mobile-app business and does not publish a public developer API,
  developer portal, or API documentation.
